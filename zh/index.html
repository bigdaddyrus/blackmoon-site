  <style>
    :root{
      --bg:          #0a0a0a;
      --bg-2:        #121212;
      --bg-3:        #161616;
      --fg:          #ece8e1;       /* warm off-white */
      --fg-dim:      #9a948a;
      --fg-faint:    #5a544c;
      --rule:        #232220;
      --rule-soft:   #1a1917;
      --accent:      #c89860;       /* tungsten amber */
      --accent-2:    #8a5a2b;

      --f-display: 'Cormorant Garamond', 'Noto Serif SC', ui-serif, Georgia, serif;
      --f-body:    'DM Sans', ui-sans-serif, system-ui, sans-serif;
      --f-mono:    'JetBrains Mono', ui-monospace, monospace;
      --f-cn:      'Noto Serif SC', 'Cormorant Garamond', serif;

      --max: 1240px;
      --pad: clamp(20px, 4vw, 56px);
    }

    /* Subtle film-grain overlay — vinyl/analog texture */
    body::before{
      content:"";position:fixed;inset:0;z-index:1000;pointer-events:none;
      opacity:0.06;mix-blend-mode:overlay;
      background-image:url("data:image/svg+xml;utf8,<svg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.95  0 0 0 0 0.92  0 0 0 0 0.85  0 0 0 1 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
      background-size:200px 200px;
    }
    /* Vignette to deepen the room corners */
    body::after{
      content:"";position:fixed;inset:0;z-index:999;pointer-events:none;
      background:radial-gradient(ellipse 90% 70% at 50% 50%, transparent 40%, rgba(0,0,0,0.55) 100%);
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-weight:300;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden}
    body{font-family:var(--f-cn),var(--f-body);line-height:1.7}
    html{overflow-x:hidden}
    a{color:inherit;text-decoration:none}
    img,svg{display:block;max-width:100%}
    ::selection{background:var(--accent);color:var(--bg)}
    html{scroll-behavior:smooth}

    /* ─── Typography utilities ─── */
    .display{font-family:var(--f-display);font-weight:300;letter-spacing:-0.01em;line-height:1.02}
    .mono{font-family:var(--f-mono);font-size:11px;font-weight:400;letter-spacing:0.12em;text-transform:uppercase;color:var(--fg-dim)}
    .cn{font-family:var(--f-cn);font-weight:300}
    .eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:0.18em;text-transform:uppercase;color:var(--fg-faint)}

    /* ─── Layout ─── */
    .wrap{max-width:var(--max);margin:0 auto;padding-left:var(--pad);padding-right:var(--pad)}
    section{position:relative;border-top:1px solid var(--rule)}
    section:first-of-type{border-top:0}

    /* ─── Top nav ─── */
    .nav{position:fixed;inset:0 0 auto 0;z-index:50;backdrop-filter:blur(14px) saturate(120%);-webkit-backdrop-filter:blur(14px) saturate(120%);background:rgba(10,10,10,0.82);border-bottom:1px solid var(--rule-soft)}
    .nav-inner{display:flex;align-items:center;justify-content:space-between;height:60px}
    /* Logo mark — SVG as mask so it inherits currentColor */
    .brand-mark{width:30px;height:30px;display:inline-block;flex-shrink:0;
      background-color:var(--fg);
      -webkit-mask:url('../assets/blackmoon-logo.svg') center / contain no-repeat;
              mask:url('../assets/blackmoon-logo.svg') center / contain no-repeat;
      filter:drop-shadow(0 0 14px rgba(200,152,96,0.22))}
    .brand-mark.lg{width:54px;height:54px}
    .brand{display:flex;align-items:center;gap:12px;font-family:var(--f-display);font-size:18px;letter-spacing:0.01em}
    .brand-cn{font-family:var(--f-cn);color:var(--fg-dim);font-size:14px;margin-left:2px}
    .nav ul{list-style:none;display:flex;gap:28px;align-items:center}
    .nav ul a{font-family:var(--f-mono);font-size:10.5px;letter-spacing:0.18em;text-transform:uppercase;color:var(--fg-dim);transition:color .2s}
    .nav ul a:hover{color:var(--fg)}
    .nav-cta{font-family:var(--f-mono);font-size:10.5px;letter-spacing:0.18em;text-transform:uppercase;padding:9px 14px;border:1px solid var(--rule);border-radius:999px;transition:all .2s}
    .nav-cta:hover{border-color:var(--accent);color:var(--accent)}
    .nav-right{display:flex;align-items:center;gap:8px}
    .lang-toggle{display:flex;align-items:center;gap:6px;margin-right:16px}
    .lang-link{font-family:var(--f-mono);font-size:10.5px;letter-spacing:0.14em;color:var(--fg-faint);transition:color .2s}
    .lang-link:hover{color:var(--fg)}
    .lang-link.active{color:var(--fg);font-weight:500}
    .lang-sep{color:var(--rule);font-size:10px}
    @media (max-width: 720px){ .nav ul{display:none} }

    /* ─── Hero ─── */
    .hero{min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;padding-top:120px;padding-bottom:64px;position:relative;overflow:hidden}
    .hero-media{position:absolute;inset:0;z-index:0;background-image:url('../assets/hero.jpg');background-size:cover;background-position:center;filter:brightness(0.78) saturate(1.05);pointer-events:none}
    .hero-media::after{content:"";position:absolute;inset:0;background:
      radial-gradient(ellipse 70% 55% at 50% 45%, transparent 0%, rgba(10,10,10,0.55) 65%, var(--bg) 100%),
      linear-gradient(180deg, rgba(10,10,10,0.55) 0%, rgba(10,10,10,0.15) 25%, rgba(10,10,10,0.25) 55%, var(--bg) 100%),
      linear-gradient(90deg, rgba(10,10,10,0.45) 0%, transparent 35%, transparent 65%, rgba(10,10,10,0.45) 100%);pointer-events:none}
    .hero-placeholder{position:absolute;inset:0;display:grid;place-items:center;
      background:
        radial-gradient(circle at 65% 50%, oklch(0.25 0.01 60) 0%, oklch(0.16 0.008 60) 35%, var(--bg) 70%),
        repeating-linear-gradient(45deg, transparent 0 22px, color-mix(in oklch,var(--fg-faint) 6%,transparent) 22px 23px)}
    .record{position:absolute;right:-8%;top:50%;transform:translateY(-50%);width:min(78vh,860px);aspect-ratio:1;border-radius:50%;
      background:
        radial-gradient(circle at center, oklch(0.32 0.02 30) 0 14%, oklch(0.13 0.006 60) 14.1% 15.5%, var(--accent) 15.6% 16.2%, oklch(0.13 0.006 60) 16.3% 18%, oklch(0.16 0 0) 18.1% 100%),
        repeating-radial-gradient(circle at center, color-mix(in oklch,var(--fg-faint) 0%,transparent) 0 1.5px, color-mix(in oklch,var(--fg-faint) 14%,transparent) 1.5px 2px);
      box-shadow:0 60px 120px -20px oklch(0 0 0 / 0.7), inset 0 0 60px oklch(0 0 0 / 0.6);
      opacity:0.55;animation:spin 28s linear infinite}
    @keyframes spin{to{transform:translateY(-50%) rotate(360deg)}}
    .hero-content{position:relative;z-index:2}
    .hero-eyebrow{display:flex;align-items:center;gap:14px;margin-bottom:36px}
    .hero-eyebrow .bar{width:48px;height:1px;background:var(--accent)}
    .hero-title{font-size:clamp(64px, 12vw, 168px);font-weight:300;margin-bottom:18px}
    .hero-title .ital{font-style:italic;color:var(--accent)}
    .hero-subtitle{font-family:var(--f-display);font-size:clamp(20px,2.6vw,30px);font-weight:300;color:var(--fg-dim);max-width:620px;line-height:1.35;margin-bottom:48px;font-style:italic}
    .hero-ctas{display:flex;gap:14px;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;font-family:var(--f-mono);font-size:11px;letter-spacing:0.18em;text-transform:uppercase;border:1px solid var(--rule);transition:all .25s ease;color:var(--fg)}
    .btn .arr{transition:transform .25s ease}
    .btn:hover .arr{transform:translateX(4px)}
    .btn-primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
    .btn-primary:hover{background:#d9a868;border-color:#d9a868}
    .btn-ghost{background:transparent;color:var(--fg);border-color:var(--rule)}
    .btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
    .nav-cta{border-radius:0 !important}

    .hero-foot{position:absolute;left:var(--pad);right:var(--pad);bottom:24px;display:flex;justify-content:space-between;align-items:flex-end;z-index:2;gap:24px;flex-wrap:wrap}
    .hero-foot .col{display:flex;flex-direction:column;gap:6px}
    .hero-foot .val{font-family:var(--f-display);font-size:18px;color:var(--fg)}

    /* ─── Section headers ─── */
    .sec{padding:120px 0 120px}
    .sec-head{display:grid;grid-template-columns:120px 1fr;gap:48px;margin-bottom:72px;align-items:start}
    @media (max-width:720px){ .sec-head{grid-template-columns:1fr;gap:16px} .sec{padding:80px 0} }
    .sec-num{font-family:var(--f-mono);font-size:11px;letter-spacing:0.2em;color:var(--fg-faint);padding-top:14px}
    .sec-title{font-family:var(--f-display);font-size:clamp(44px,6vw,80px);font-weight:300;letter-spacing:-0.01em;line-height:1.02}
    .sec-title .ital{font-style:italic;color:var(--accent)}
    .sec-title .cn{display:block;font-size:0.42em;color:var(--fg-faint);margin-top:14px;letter-spacing:0.04em}

    /* ─── Sound section ─── */
    .sound-grid{display:grid;grid-template-columns:120px 1fr 1fr;gap:48px}
    @media (max-width:880px){ .sound-grid{grid-template-columns:1fr;gap:36px} }
    .sound-lede{font-family:var(--f-display);font-size:clamp(22px,2.4vw,28px);line-height:1.4;color:var(--fg);font-weight:300}
    .sound-lede .accent{color:var(--accent);font-style:italic}
    .sound-body p{color:var(--fg-dim);margin-bottom:18px;max-width:46ch}
    .core{margin-top:48px;border-top:1px solid var(--rule);padding-top:32px;display:grid;grid-template-columns:120px 1fr;gap:48px;align-items:start}
    @media (max-width:880px){ .core{grid-template-columns:1fr;gap:18px} }
    .core-label{font-family:var(--f-mono);font-size:10.5px;letter-spacing:0.18em;text-transform:uppercase;color:var(--fg-faint)}
    .core-line{font-family:var(--f-display);font-style:italic;font-size:clamp(20px,2vw,24px);line-height:1.5;color:var(--fg);font-weight:300;max-width:48ch}
    .core-line .accent{color:var(--accent);font-style:normal;font-weight:400}

    .genres{display:flex;gap:8px;flex-wrap:wrap;margin-top:36px}
    .genre{padding:9px 14px;border:1px solid var(--rule);font-family:var(--f-mono);font-size:10.5px;letter-spacing:0.16em;text-transform:uppercase;color:var(--fg-dim)}
    .genre.on{color:var(--accent);border-color:var(--accent)}

    /* ─── Marquee divider ─── */
    .marquee{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);overflow:hidden;white-space:nowrap;padding:22px 0;display:flex;gap:48px;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
    .marquee-track{display:inline-flex;gap:48px;animation:slide 40s linear infinite;font-family:var(--f-display);font-size:clamp(28px,4vw,44px);font-style:italic;color:var(--fg-dim);white-space:nowrap}
    .marquee-track span{display:inline-flex;align-items:center;gap:48px}
    .marquee-track .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
    @keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}

    /* ─── Location ─── */
    .loc-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:64px;align-items:stretch}
    @media (max-width:880px){ .loc-grid{grid-template-columns:1fr;gap:36px} }
    .map-card{position:relative;aspect-ratio:4/3;overflow:hidden;border:1px solid var(--rule);background:var(--bg-2);transition:transform .35s ease, border-color .35s ease}
    .map-card:hover{border-color:var(--accent)}
    .map-svg{position:absolute;inset:0;width:100%;height:100%}
    .map-pin{position:absolute;left:54%;top:50%;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:6px}
    .map-pin-dot{width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 6px color-mix(in oklch,var(--accent) 24%,transparent),0 0 24px var(--accent);animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 6px color-mix(in oklch,var(--accent) 24%,transparent),0 0 24px var(--accent)}50%{box-shadow:0 0 0 14px color-mix(in oklch,var(--accent) 6%,transparent),0 0 28px var(--accent)}}
    .map-pin-label{font-family:var(--f-mono);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--fg);background:rgba(10,10,10,0.85);padding:4px 8px;border:1px solid var(--rule)}
    .map-overlay{position:absolute;left:14px;right:14px;bottom:14px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
    .map-overlay:hover{border-color:var(--accent)}
    .map-coord{font-family:var(--f-mono);font-size:10px;letter-spacing:0.12em;color:var(--fg-dim);background:rgba(10,10,10,0.75);padding:4px 8px;border:1px solid var(--rule-soft)}

    .addr{display:flex;flex-direction:column;gap:28px;font-style:normal}
    .addr-block{display:flex;flex-direction:column;gap:8px}
    .addr-label{font-family:var(--f-mono);font-size:10.5px;letter-spacing:0.18em;text-transform:uppercase;color:var(--fg-faint)}
    .addr-line{font-family:var(--f-display);font-size:23px;line-height:1.45;color:var(--fg);font-weight:300}
    .addr-line.cn{font-family:var(--f-cn);font-size:21px}
    .addr-meta{font-family:var(--f-mono);font-size:11px;color:var(--fg-dim);letter-spacing:0.06em}
    .map-ctas{display:flex;flex-direction:column;gap:10px;margin-top:8px}
    .map-ctas .btn{width:100%;justify-content:space-between}

    .hours{margin-top:8px;border-top:1px solid var(--rule);padding-top:24px}
    .hours-row{display:grid;grid-template-columns:1fr auto;padding:10px 0;border-bottom:1px solid color-mix(in oklch,var(--rule) 50%,transparent);font-family:var(--f-mono);font-size:11px;letter-spacing:0.1em;color:var(--fg-dim)}
    .hours-row:last-child{border-bottom:0}
    .hours-row.today{color:var(--accent)}
    .hours-row .day{text-transform:uppercase;letter-spacing:0.16em}

    /* ─── Contact (Stay in Touch) ─── */
    .contact-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
    @media (max-width:720px){ .contact-grid{grid-template-columns:1fr} }
    .contact-card{border:1px solid var(--rule);padding:32px;display:flex;flex-direction:column;gap:14px;background:var(--bg-2);transition:border-color .3s, background .3s}
    .contact-card:hover{border-color:var(--accent);background:var(--bg-3)}
    .contact-icon{width:38px;height:38px;border-radius:50%;border:1px solid var(--rule);display:grid;place-items:center;color:var(--accent);font-family:var(--f-mono);font-size:12px}
    .contact-title{font-family:var(--f-display);font-size:28px;color:var(--fg);font-weight:400}
    .contact-handle{font-family:var(--f-mono);font-size:11px;color:var(--fg-dim);letter-spacing:0.1em}
    .contact-body{color:var(--fg-dim);max-width:42ch;font-size:14.5px}
    .contact-action{margin-top:auto}

    /* WeChat reveal */
    .wechat-card{position:relative}
    .qr-wrap{display:flex;align-items:flex-start;gap:20px;margin-top:8px}
    .qr-placeholder{width:124px;height:124px;background:#fafaf7;display:grid;place-items:center;flex-shrink:0;border:1px solid var(--rule);position:relative;overflow:hidden;
      opacity:0;transform:scale(0.94) translateY(8px);transition:opacity .35s ease, transform .35s ease;pointer-events:none}
    .wechat-card.revealed .qr-placeholder{opacity:1;transform:scale(1) translateY(0)}
    .qr-img{width:124px;height:124px;object-fit:contain;flex-shrink:0;opacity:0;transform:scale(.92) translateY(6px);transition:opacity .5s ease,transform .5s ease}
    .wechat-card.revealed .qr-img{opacity:1;transform:scale(1) translateY(0)}
    .qr-placeholder::before{content:"";position:absolute;inset:8px;
      background:
        linear-gradient(#0a0a0a,#0a0a0a) 0 0/22% 22% no-repeat,
        linear-gradient(#0a0a0a,#0a0a0a) 78% 0/22% 22% no-repeat,
        linear-gradient(#0a0a0a,#0a0a0a) 0 78%/22% 22% no-repeat,
        repeating-conic-gradient(#0a0a0a 0 25%, transparent 0 50%) 0 0/12% 12%}
    .qr-placeholder::after{content:"placeholder";position:absolute;bottom:6px;left:0;right:0;text-align:center;font-family:var(--f-mono);font-size:8px;letter-spacing:0.12em;color:#999;text-transform:uppercase;background:#fafaf7;padding-top:2px}
    .qr-caption{font-family:var(--f-mono);font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg-faint);max-width:18ch;line-height:1.6;opacity:0;transition:opacity .4s ease .1s}
    .wechat-card.revealed .qr-caption{opacity:1}

    /* ─── Press / Quote strip ─── */
    .quote{padding:120px 0;border-top:1px solid var(--rule);text-align:center}
    .quote-text{font-family:var(--f-display);font-size:clamp(28px,3.6vw,46px);font-weight:300;font-style:italic;line-height:1.35;max-width:20ch;margin:0 auto;color:var(--fg)}
    .quote-attr{margin-top:32px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:0.2em;text-transform:uppercase;color:var(--fg-faint)}

    /* Manifesto collapse — visible to crawlers, hidden visually until toggled */
    .manifesto-collapsed{max-height:0;overflow:hidden;opacity:0;transition:max-height .5s ease, opacity .5s ease}
    .manifesto-expanded{max-height:none;overflow:visible;opacity:1;transition:max-height .5s ease, opacity .5s ease}

    /* ─── Footer ─── */
    footer{border-top:1px solid var(--rule);padding:48px 0 32px}
    .foot-grid{display:flex;justify-content:space-between;align-items:flex-start;gap:32px;flex-wrap:wrap}
    .foot-brand{font-family:var(--f-display);font-size:22px;display:flex;align-items:center;gap:10px}
    .foot-meta{font-family:var(--f-mono);font-size:10.5px;letter-spacing:0.14em;color:var(--fg-faint);text-transform:uppercase}
    .foot-bottom{margin-top:40px;display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10.5px;color:var(--fg-faint);letter-spacing:0.1em;flex-wrap:wrap;gap:10px}

    /* ─── Section number marker mode (toggleable) ─── */
    [data-numbers="off"] .sec-num{display:none}
    [data-numbers="off"] .sec-head{grid-template-columns:1fr}
    [data-numbers="off"] .sound-grid{grid-template-columns:1fr 1fr}
    @media (max-width:880px){ [data-numbers="off"] .sound-grid{grid-template-columns:1fr} }

    /* ─── Gallery sections (Drinks / Food / Space) ─── */
    .gallery-intro{display:grid;grid-template-columns:120px 1fr 1fr;gap:48px;margin-bottom:56px}
    @media (max-width:880px){ .gallery-intro{grid-template-columns:1fr;gap:24px} }
    .gallery-lede{font-family:var(--f-display);font-size:clamp(22px,2.4vw,28px);line-height:1.45;color:var(--fg);font-weight:300}
    .gallery-lede .accent{color:var(--accent);font-style:italic}
    .gallery-body p{color:var(--fg-dim);max-width:44ch;font-size:14.5px}

    .gal-grid{display:grid;grid-template-columns:1.4fr 1fr;grid-template-rows:repeat(2,auto);gap:16px}
    @media (max-width:720px){ .gal-grid{grid-template-columns:1fr} }
    .gal-slot{position:relative;background:var(--bg-2);border:1px solid var(--rule);overflow:hidden}
    .gal-slot.hero{grid-row:span 2;aspect-ratio:4/5}
    .gal-slot.sm{aspect-ratio:5/4}
    @media (max-width:720px){ .gal-slot.hero{grid-row:auto;aspect-ratio:4/5} }
    .gal-slot img{width:100%;height:100%;display:block;object-fit:cover}
    .gal-cap{position:absolute;left:14px;bottom:12px;font-family:var(--f-mono);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--fg-dim);background:rgba(10,10,10,0.7);padding:5px 9px;border:1px solid var(--rule-soft);pointer-events:none;z-index:2}

    .gal-wide{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:repeat(2,minmax(0,1fr));gap:16px;aspect-ratio:16/8}
    @media (max-width:880px){ .gal-wide{grid-template-columns:1fr 1fr;aspect-ratio:auto} }
    .gal-wide .w-hero{grid-row:1 / span 2}
    .gal-wide .gal-slot{aspect-ratio:auto}
    @media (max-width:880px){ .gal-wide .w-hero{grid-row:span 1} .gal-wide .gal-slot{aspect-ratio:5/4} }

    .menu{margin-top:20px;border-top:1px solid var(--rule);padding-top:24px}
    .menu-row{display:grid;grid-template-columns:1fr auto;gap:16px;padding:18px 0;border-bottom:1px solid var(--rule-soft);align-items:baseline}
    .menu-row:last-child{border-bottom:0}
    .menu-name{font-family:var(--f-display);font-size:22px;color:var(--fg);font-weight:300}
    .menu-name .ital{font-style:italic;color:var(--accent);font-weight:300}
    .menu-desc{display:block;font-family:var(--f-body);font-size:13px;color:var(--fg-dim);margin-top:5px;letter-spacing:0.01em;font-weight:300;max-width:46ch}
    .menu-price{font-family:var(--f-mono);font-size:12px;color:var(--accent);letter-spacing:0.08em;white-space:nowrap}

    .space-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:48px;border-top:1px solid var(--rule);padding-top:28px}
    @media (max-width:720px){ .space-meta{grid-template-columns:repeat(2,1fr)} }
    .space-stat-label{font-family:var(--f-mono);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--fg-faint);display:block;margin-bottom:6px}
    .space-stat-val{font-family:var(--f-display);font-size:24px;color:var(--fg);font-weight:300;letter-spacing:-0.01em}
    .space-stat-val .ital{font-style:italic;color:var(--accent)}

    /* ─── Vinyl scrollable gallery (Core Curation) ─── */
    .vinyl-wrap{margin-top:48px}
    .vinyl-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px;gap:24px;flex-wrap:wrap}
    .vinyl-head .label{font-family:var(--f-mono);font-size:10.5px;letter-spacing:0.18em;text-transform:uppercase;color:var(--fg-faint)}
    .vinyl-head .hint{font-family:var(--f-mono);font-size:10px;letter-spacing:0.14em;color:var(--fg-faint);text-transform:uppercase}
    .vinyl-head .hint::before{content:"← → ";color:var(--accent);margin-right:6px}
    .vinyl-rail{
      display:flex;gap:18px;overflow-x:auto;overflow-y:hidden;
      padding:4px 0 22px;
      scroll-snap-type:x mandatory;
      scrollbar-width:thin;scrollbar-color:var(--rule) transparent;
      -webkit-overflow-scrolling:touch;
    }
    .vinyl-rail::-webkit-scrollbar{height:6px}
    .vinyl-rail::-webkit-scrollbar-track{background:transparent}
    .vinyl-rail::-webkit-scrollbar-thumb{background:var(--rule);border-radius:3px}
    .vinyl-rail::-webkit-scrollbar-thumb:hover{background:var(--accent)}
    .lp{flex:0 0 220px;scroll-snap-align:start;display:flex;flex-direction:column;gap:14px}
    @media (max-width:720px){ .lp{flex:0 0 170px} }
    .lp-sleeve{aspect-ratio:1;background:var(--bg-2);border:1px solid var(--rule);position:relative;overflow:hidden;transition:transform .25s ease, border-color .25s ease}
    .lp-sleeve:hover{transform:translateY(-3px);border-color:var(--accent)}
    .lp-sleeve img{width:100%;height:100%;display:block;object-fit:cover}
    .lp-sleeve::after{content:"";position:absolute;left:-4%;top:50%;width:18%;aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(circle,#0a0a0a 0 1.5px,#1a1a1a 1.5px 2.5px);transform:translateY(-50%);box-shadow:inset 0 0 0 2px #0a0a0a, 0 0 0 1px rgba(200,152,96,0.25);pointer-events:none;opacity:0.85}
    .lp-info{display:flex;flex-direction:column;gap:4px;padding:0 2px}
    .lp-artist{font-family:var(--f-display);font-size:16px;color:var(--fg);font-weight:400;line-height:1.2;letter-spacing:-0.005em}
    .lp-album{font-family:var(--f-display);font-style:italic;font-size:14px;color:var(--fg-dim);line-height:1.3}
    .lp-meta{display:flex;gap:10px;margin-top:4px;font-family:var(--f-mono);font-size:9.5px;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg-faint)}
    .lp-meta .dot{color:var(--rule)}
    .lp-meta .genre-tag{color:var(--accent)}

    /* Mini-program QR card at the end of the vinyl rail */
    .lp-qr{flex:0 0 260px;scroll-snap-align:start;display:flex;flex-direction:column;gap:14px;padding:18px;border:1px dashed var(--accent);background:linear-gradient(180deg,rgba(200,152,96,0.04),transparent)}
    @media (max-width:720px){ .lp-qr{flex:0 0 220px} }
    .lp-qr-head{display:flex;align-items:center;gap:8px}
    .lp-qr-head .pip{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
    .lp-qr-head span{font-family:var(--f-mono);font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--accent)}
    .lp-qr-title{font-family:var(--f-display);font-size:22px;color:var(--fg);font-weight:300;line-height:1.15;letter-spacing:-0.005em;margin-top:2px}
    .lp-qr-title .ital{font-style:italic;color:var(--accent)}
    .lp-qr-sub{font-family:var(--f-cn);font-size:12px;color:var(--fg-dim);letter-spacing:0.04em}
    .lp-qr-slot{aspect-ratio:1;background:#fafaf7;border:1px solid var(--rule);display:grid;place-items:center;position:relative;overflow:hidden;margin-top:4px}
    .lp-qr-slot::before{content:"";position:absolute;inset:14px;
      background:
        linear-gradient(#0a0a0a,#0a0a0a) 0 0/22% 22% no-repeat,
        linear-gradient(#0a0a0a,#0a0a0a) 78% 0/22% 22% no-repeat,
        linear-gradient(#0a0a0a,#0a0a0a) 0 78%/22% 22% no-repeat,
        repeating-conic-gradient(#0a0a0a 0 25%, transparent 0 50%) 0 0/13% 13%}
    .lp-qr-slot::after{content:"微信小程序 · mini-program";position:absolute;bottom:8px;left:0;right:0;text-align:center;font-family:var(--f-mono);font-size:8.5px;letter-spacing:0.14em;color:#666;text-transform:uppercase;background:#fafaf7;padding:3px 0}
    .lp-qr-slot:has(img)::before,.lp-qr-slot:has(img)::after{display:none}
    .lp-qr-foot{font-family:var(--f-mono);font-size:9.5px;letter-spacing:0.16em;text-transform:uppercase;color:var(--fg-faint);margin-top:2px}

    /* ─── Ravens hours band (Plate) ─── */
    /* (uses .coffee-hours class shape but with different label color rules — styles handled inline where needed) */

    /* ─── People section ─── */
    .people-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
    @media (max-width:880px){ .people-grid{grid-template-columns:repeat(2,1fr)} }
    @media (max-width:540px){ .people-grid{grid-template-columns:1fr} }
    .person{display:flex;flex-direction:column;gap:18px}
    .person-portrait{aspect-ratio:3/4;background:var(--bg-2);border:1px solid var(--rule);overflow:hidden;position:relative;transition:border-color .3s}
    .person:hover .person-portrait{border-color:var(--accent)}
    .person-info{display:flex;flex-direction:column;gap:6px}
    .person-name{font-family:var(--f-display);font-size:22px;color:var(--fg);font-weight:400;line-height:1.15;letter-spacing:-0.005em}
    .person-name .cn{color:var(--fg-dim);font-size:0.7em;margin-left:4px;font-weight:300}
    .person-role{font-family:var(--f-mono);font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--accent)}
    .person-bio{font-family:var(--f-body);font-size:13px;line-height:1.55;color:var(--fg-dim);margin-top:4px;font-weight:300;max-width:30ch}

    /* ─── Cat easter egg (bottom backdrop) ─── */
    .cat-egg{position:relative;height:64vh;min-height:480px;border-top:1px solid var(--rule);overflow:hidden;display:flex;align-items:flex-end}
    .cat-egg-img{position:absolute;inset:0;background-image:url('../assets/cat.jpg');background-size:cover;background-position:center;filter:brightness(0.55) saturate(1.05);transform:scale(1.02)}
    .cat-egg::before{content:"";position:absolute;inset:0;background:
      linear-gradient(180deg, var(--bg) 0%, rgba(10,10,10,0.4) 18%, rgba(10,10,10,0.15) 50%, rgba(10,10,10,0.45) 92%, var(--bg) 100%),
      radial-gradient(ellipse 60% 50% at 50% 60%, transparent 0%, rgba(10,10,10,0.55) 80%);
      z-index:1;pointer-events:none}
    .cat-egg-caption{position:relative;z-index:2;width:100%;padding:0 var(--pad) 56px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
    .cat-egg-caption .left{display:flex;flex-direction:column;gap:8px}
    .cat-egg-caption .eyebrow{color:var(--accent)}
    .cat-egg-caption h2{font-family:var(--f-display);font-size:clamp(36px,5vw,68px);font-weight:300;color:var(--fg);line-height:1.05;letter-spacing:-0.01em}
    .cat-egg-caption h2 .ital{font-style:italic;color:var(--accent)}
    .cat-egg-caption .right{font-family:var(--f-mono);font-size:10.5px;letter-spacing:0.18em;text-transform:uppercase;color:var(--fg-dim);text-align:right;max-width:30ch;line-height:1.7}

    /* Coffee hours band — daytime program */
    .coffee-hours{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin:48px 0 56px;padding:32px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);align-items:start}
    @media (max-width:720px){ .coffee-hours{grid-template-columns:1fr;gap:24px} }
    .ch-block{display:flex;flex-direction:column;gap:8px}
    .ch-right{text-align:right;align-items:flex-end}
    @media (max-width:720px){ .ch-right{text-align:left;align-items:flex-start} }
    .ch-label{font-family:var(--f-mono);font-size:10.5px;letter-spacing:0.18em;text-transform:uppercase;color:var(--fg-faint)}
    .ch-val{font-family:var(--f-display);font-size:clamp(28px,3.4vw,42px);color:var(--fg);font-weight:300;letter-spacing:-0.01em;line-height:1.1}
    .ch-val .ital{font-style:italic;color:var(--accent)}
    .ch-meta{font-family:var(--f-cn);font-size:13px;color:var(--fg-dim);letter-spacing:0.04em}

    /* Reservations callout band */
    .reserve-band{margin-bottom:36px;padding:28px 32px;border:1px solid var(--accent);background:linear-gradient(180deg,rgba(200,152,96,0.06),transparent);display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
    .reserve-band .left{display:flex;flex-direction:column;gap:6px}
    .reserve-band .label{font-family:var(--f-mono);font-size:10.5px;letter-spacing:0.18em;text-transform:uppercase;color:var(--accent)}
    .reserve-band .title{font-family:var(--f-display);font-size:clamp(22px,2.4vw,28px);font-weight:300;color:var(--fg);letter-spacing:-0.01em}
    .reserve-band .title .ital{font-style:italic;color:var(--accent)}
    .reserve-band .meta{font-family:var(--f-cn);font-size:13px;color:var(--fg-dim);margin-top:2px}
    .reserve-band .actions{display:flex;gap:10px;flex-wrap:wrap}

    /* ─── Mobile Responsive ─── */

    /* Small tablets & large phones */
    @media (max-width:600px){
      :root{--pad:16px}

      /* Nav */
      .nav-inner{height:52px}
      .nav-cta{display:none}
      .brand{font-size:16px;gap:8px}
      .brand-cn{font-size:12px}
      .brand-mark{width:24px;height:24px}

      /* Hero */
      .hero{min-height:85vh;padding-top:80px;padding-bottom:40px}
      .hero-eyebrow{margin-bottom:20px}
      .hero-subtitle{font-size:18px;margin-bottom:32px;max-width:100%}
      .hero-ctas{flex-direction:column;gap:10px}
      .hero-ctas .btn{width:100%;justify-content:center}
      .hero-foot{position:relative;left:auto;right:auto;bottom:auto;flex-direction:column;align-items:flex-start;gap:16px;margin-top:36px;padding-left:var(--pad);padding-right:var(--pad)}
      .hero-foot .col{text-align:left !important}
      .record{display:none}

      /* Sections */
      .sec{padding:56px 0}
      .sec-head{margin-bottom:40px;gap:10px}
      .sec-title{font-size:clamp(36px,10vw,52px)}

      /* Sound grid — collapse the empty first column */
      .sound-grid{grid-template-columns:1fr !important;gap:28px}
      .sound-lede{font-size:20px}

      /* Core curation */
      .core{grid-template-columns:1fr !important;gap:14px;margin-top:32px;padding-top:24px}
      .genres{gap:6px;margin-top:24px}
      .genre{padding:7px 10px;font-size:9.5px}

      /* Gallery intros — collapse the empty first column */
      .gallery-intro{grid-template-columns:1fr !important;gap:18px;margin-bottom:36px}
      .gallery-lede{font-size:20px}

      /* Gallery grids */
      .gal-grid{gap:10px}
      .gal-wide{grid-template-columns:1fr !important;aspect-ratio:auto !important}
      .gal-wide .gal-slot{aspect-ratio:4/3 !important}
      .gal-wide .w-hero{grid-row:span 1 !important;aspect-ratio:4/3 !important}
      .gal-cap{font-size:9px;left:8px;bottom:8px;padding:4px 7px}

      /* Space meta stats */
      .space-meta{grid-template-columns:1fr 1fr;gap:16px;margin-top:32px;padding-top:20px}
      .space-stat-val{font-size:20px}

      /* Vinyl rail */
      .vinyl-wrap{margin-top:32px}
      .lp{flex:0 0 155px !important}
      .lp-artist{font-size:14px}
      .lp-album{font-size:12px}
      .lp-qr{flex:0 0 200px !important;padding:14px}
      .lp-qr-title{font-size:18px}

      /* Menu */
      .menu-row{gap:10px}
      .menu-name{font-size:18px}
      .menu-desc{font-size:12px}

      /* Coffee hours band */
      .coffee-hours{grid-template-columns:1fr !important;gap:18px;margin:32px 0 40px;padding:24px 0}
      .ch-val{font-size:clamp(24px,6vw,32px)}
      .ch-right{text-align:left !important;align-items:flex-start !important}

      /* People */
      .people-grid{grid-template-columns:1fr !important;gap:32px}
      .person-portrait{aspect-ratio:4/5}
      .person-bio{max-width:100%}

      /* Location */
      .loc-grid{gap:28px !important}
      .map-card{aspect-ratio:3/2 !important;max-height:240px !important}
      .addr-line{font-size:19px}
      .addr-line.cn{font-size:17px}
      .addr{gap:20px}
      .map-overlay{left:8px;right:8px;bottom:8px}
      .hours{margin-top:4px;padding-top:16px}
      .hours-row{padding:8px 0;font-size:10px}

      /* Contact */
      .contact-grid{gap:16px}
      .contact-card{padding:20px}
      .contact-title{font-size:22px}
      .contact-body{font-size:13px}
      .qr-wrap{flex-direction:column;gap:12px}
      .qr-placeholder{width:100px;height:100px}
      .qr-img{width:100px;height:100px}

      /* Reserve band */
      .reserve-band{padding:20px 16px;flex-direction:column;align-items:flex-start;gap:18px}
      .reserve-band .title{font-size:20px}
      .reserve-band .meta{font-size:12px}
      .reserve-band .actions{width:100%}
      .reserve-band .actions .btn{flex:1;justify-content:center;text-align:center}

      /* Press quote */
      .quote{padding:64px 0}
      .quote-text{font-size:clamp(22px,6vw,32px);max-width:100%}

      /* Cat easter egg */
      .cat-egg{height:50vh;min-height:360px}
      .cat-egg-caption{flex-direction:column;align-items:flex-start;gap:16px;padding-bottom:32px}
      .cat-egg-caption .right{text-align:left;font-size:10px}

      /* Footer */
      .foot-grid{flex-direction:column;gap:20px}
      .foot-meta{text-align:left !important}
      .foot-bottom{flex-direction:column;gap:6px}

      /* Buttons — larger touch targets */
      .btn{padding:14px 18px;font-size:10.5px}

      /* Marquee */
      .marquee{padding:16px 0}
      .marquee-track{font-size:clamp(22px,5vw,32px);gap:32px}
      .marquee-track span{gap:32px}
    }

    /* Extra small phones (≤380px) */
    @media (max-width:380px){
      :root{--pad:12px}
      .hero-title{font-size:clamp(48px,14vw,64px)}
      .sec-title{font-size:clamp(30px,9vw,44px)}
      .contact-card{padding:16px}
      .btn{padding:12px 14px;font-size:10px}
      .reserve-band .actions{flex-direction:column}
      .reserve-band .actions .btn{width:100%}
      .map-card{max-height:200px !important}
    }

  </style>
</head>

  <!-- ─── Tweaks panel mount ─────────────────────────────────── -->
  <div id="tweaks-root"></div>

  <!-- ─── Interactive bits (vanilla) ─────────────────────────── -->
  <script>
    (function(){
      // Generic QR-reveal — works for any .wechat-card with a toggle button inside
      var cards = document.querySelectorAll('.wechat-card');
      cards.forEach(function(card){
        var btn = card.querySelector('button[type="button"]');
        var lbl = btn && btn.querySelector('.wechat-label, .oa-label');
        function toggle(){
          var on = !card.classList.contains('revealed');
          card.classList.toggle('revealed', on);
          card.setAttribute('aria-expanded', String(on));
          if (lbl) lbl.textContent = on ? '隐藏二维码 · Hide QR' : '显示二维码 · Reveal QR';
        }
        if (btn) btn.addEventListener('click', function(e){ e.stopPropagation(); toggle(); });
        card.addEventListener('mouseenter', function(){ if (!card.classList.contains('revealed')) toggle(); });
        card.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(); } });
      });
    })();
  </script>
